[package]
name = "roboto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# [[bin]]
# name = "roboto"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
thiserror    = "1.0.21"
cosmwasm-std = {version = "=2.0.1", features = ["staking", "stargate"]}
cosmwasm-schema = "1.2.7"
cw-storage-plus = "1.1.0"
anyhow = "1.0.71"
serde = "1.0.164"
prost = "0.11.9"
schemars = "0.8.12"

[dev-dependencies]
cw20 = "2.0.0"
cw20-base = "2.0.0"
